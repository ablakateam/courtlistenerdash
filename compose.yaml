name: courtlistenerdash

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COURTLISTENER_WEB_HOST: 0.0.0.0
      COURTLISTENER_WEB_PORT: 8788
      COURTLISTENER_PUBLIC_PORT: ${COURTLISTENER_HTTPS_PORT:-8443}
      COURTLISTENER_WEB_DATA_DIR: /data
      COURTLISTENER_SESSION_SECRET_FILE: /run/secrets/session_secret
      COURTLISTENER_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      COURTLISTENER_WEB_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      COURTLISTENER_SECURE_COOKIES: "true"
      COURTLISTENER_ALLOW_INSECURE_CREDENTIAL_SETUP: "false"
      COURTLISTENER_TRUST_PROXY: "true"
      COURTLISTENER_MCP_URL: ${COURTLISTENER_MCP_URL:-https://mcp.courtlistener.com/}
      COURTLISTENER_MCP_HEALTH_URL: ${COURTLISTENER_MCP_HEALTH_URL:-https://mcp.courtlistener.com/health}
    expose:
      - "8788"
    volumes:
      - courtlistener-data:/data
    secrets:
      - session_secret
      - credential_key
      - admin_password_hash
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      COURTLISTENER_SITE_ADDRESS: ${COURTLISTENER_SITE_ADDRESS:-localhost}
    ports:
      - "${COURTLISTENER_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

volumes:
  courtlistener-data:
  caddy-data:
  caddy-config:

networks:
  internal:

secrets:
  session_secret:
    file: ./secrets/session_secret
  credential_key:
    file: ./secrets/credential_key
  admin_password_hash:
    file: ./secrets/admin_password_hash
