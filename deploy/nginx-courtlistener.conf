server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/courtlistener-web/tls.crt;
    ssl_certificate_key /etc/nginx/courtlistener-web/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CourtListenerTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 3m;

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.1.0/24;
        allow 192.168.2.0/24;
        allow 192.168.12.0/24;
        allow 192.168.50.0/24;
        deny all;

        proxy_pass https://127.0.0.1:8788;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Contextual opinion questions may wait on an explicitly configured
        # legal-AI provider. Complete-opinion analysis itself runs as a
        # background job and is polled by the browser.
        proxy_read_timeout 330s;
    }
}
